[workspace]
authors = ["Stephan Preibisch <stephan.preibisch@gmx.de>"]
channels = ["conda-forge"]
name = "sofima"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
test = "python -c \"from sofima import flow_field, mesh, warp; print('SOFIMA ready!')\""

[dependencies]
python = ">=3.10"
jax = ">=0.2.25"
numpy = ">=1.21.5"
scipy = ">=1.2.3"
scikit-image = ">=0.17.2"
py-opencv = ">=4.5.5"
absl-py = ">=0.9.0"
matplotlib = "*"
pip = "*"
tqdm = ">=4.67.1,<5"
tifffile = ">=2025.12.20,<2026"
zarr = ">=3.1.5,<4"

[pypi-dependencies]
dataclasses-json = ">=0.5.6"
edt = ">=2.3.0"
connectomics = "*"
tensorstore = "*"
sofima = { path = ".", editable = true }
